version: "3.8"

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gamma
    restart: unless-stopped
    ports:
      - "18791:18789"
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - OPENCLAW_INSTANCE_NAME=gamma
    security_opt:
      - no-new-privileges:true

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gamma-cli
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - OPENCLAW_INSTANCE_NAME=gamma
    entrypoint: ["openclaw"]
    profiles:
      - cli
