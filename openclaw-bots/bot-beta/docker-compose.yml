version: "3.8"

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-beta
    restart: unless-stopped
    ports:
      - "18790:18789"
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - OPENCLAW_INSTANCE_NAME=beta
    security_opt:
      - no-new-privileges:true

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-beta-cli
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - OPENCLAW_INSTANCE_NAME=beta
    entrypoint: ["openclaw"]
    profiles:
      - cli
